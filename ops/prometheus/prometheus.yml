# Prometheus scrape config for the local Aegis stack.
global:
  scrape_interval: 15s

# Alert rules evaluate here and surface at /alerts. To page a human, run an
# Alertmanager with your receiver (Slack/PagerDuty/email) and point this at it:
#   alerting:
#     alertmanagers:
#       - static_configs:
#           - targets: ["alertmanager:9093"]
rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: aegis-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: celery
    static_configs:
      - targets: ["celery-exporter:9808"]

  # Container-level resource usage (CPU/mem/net/disk) for the whole stack.
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
