# Load JSON dashboards from disk on startup.
apiVersion: 1

providers:
  - name: Aegis
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: true
    # Re-read the JSON files this often, so an edit shows up without a restart.
    # A changed dashboard is only applied if its `version` also increased.
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards
