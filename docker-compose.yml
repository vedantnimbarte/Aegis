# Local development stack for Aegis.
#   docker compose up --build
# In-network hostnames. backend/.env points at localhost (correct when running
# the API straight on the host), which doesn't resolve from inside a container.
x-service-hosts: &service-hosts
  DATABASE_URL: postgresql+psycopg://aegis:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/aegis
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aegis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: aegis
      # Require a password for host (TCP) connections rather than trusting the
      # network — a scan sandbox can route to this port (see SECURITY.md).
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Broker holds scan payloads and is reachable from the dind network, so it
    # must not accept unauthenticated commands.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    env_file: ./backend/.env
    # Dev-only reload on host edits; the image's CMD stays reload-free so the
    # same Dockerfile is deployable. Watching just the app package keeps the
    # poller off alembic/ and tests/, which the server never imports.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    environment:
      <<: *service-hosts
      # Must match the worker's path: the API reads Strix's live run state
      # from the same shared volume to serve /scans/{id}/progress.
      STRIX_WORK_DIR: /var/aegis-scans
      # Same reason as the dashboard: inotify events don't cross the Windows
      # bind mount, so uvicorn's watcher never sees host edits. Poll instead.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend:/app
      # Read-only: the API only ever reads progress state, never writes scans.
      - scandata:/var/aegis-scans:ro

  worker:
    build:
      context: ./backend
      # Install the Strix engine into the worker image only.
      args:
        INSTALL_STRIX: "true"
    # `-E` emits task events for the Prometheus celery-exporter.
    command: celery -A app.workers.celery_app.celery worker --loglevel=info -E
    env_file: ./backend/.env
    environment:
      <<: *service-hosts
      # Strix spawns its sandbox containers on the isolated dind daemon rather
      # than the host socket, so an escape can't reach the host's Docker/root.
      # Reached over loopback because this service shares dind's network
      # namespace (see network_mode below).
      DOCKER_HOST: tcp://127.0.0.1:2375
      # Must match the scandata mount path below *and* in dind: Strix passes
      # this path to the remote daemon as a bind source, so it has to resolve
      # identically on both sides.
      STRIX_WORK_DIR: /var/aegis-scans
    # Share dind's network namespace. Strix resolves a sandbox's Caido port to
    # the address the *daemon* published it on (127.0.0.1 inside dind); without
    # a shared stack the worker's own loopback has nothing listening and the
    # bootstrap fails with InstanceNotReadyError. dind itself sits on the
    # default compose network, so db/redis still resolve by name from here.
    network_mode: "service:dind"
    depends_on:
      - api
      - redis
      - dind
    volumes:
      - ./backend:/app
      # Shared with dind so Strix's bind-mounts of the checkout resolve in both.
      # NOT under /tmp: dind mounts a tmpfs over /tmp at startup, which would
      # shadow this volume and make every bind source invalid (400 on create).
      - scandata:/var/aegis-scans

  # Isolated Docker daemon for Strix's sandbox containers (see SECURITY.md).
  # Running untrusted target code here contains a breakout to this container
  # instead of the host. It is privileged — for stronger isolation in
  # production, front it with rootless Docker / sysbox / gVisor and restrict
  # egress to the LLM + OSINT endpoints only.
  dind:
    image: docker:27-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""   # plain TCP on the internal network only
    volumes:
      - scandata:/var/aegis-scans

  # Celery Beat — ticks periodically and dispatches due recurring scans.
  beat:
    build: ./backend
    command: celery -A app.workers.celery_app.celery beat --loglevel=info
    env_file: ./backend/.env
    environment: *service-hosts
    depends_on:
      - redis
      - db

  # Next.js dashboard — dev server with hot reload. The source is bind-mounted
  # and node_modules lives in a named volume (so the host's copy never shadows
  # the container's). NEXT_PUBLIC_API_BASE_URL must be the URL the browser hits
  # on the host, not the in-network `api` hostname.
  dashboard:
    image: node:20-slim
    working_dir: /app
    command: sh -c "npm install && npm run dev -- -H 0.0.0.0"
    # next dev exits cleanly on stdin EOF, which is what it gets under
    # `compose up -d`. Keep stdin open so the dev server stays alive.
    stdin_open: true
    tty: true
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
      # Enables the "Sign in with GitHub" button; must match the App's client id.
      NEXT_PUBLIC_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      NEXT_PUBLIC_GITHUB_REDIRECT_URI: http://localhost:3001/auth/callback
      # inotify events don't cross the Windows bind mount, so Next's watcher
      # never sees host edits and silently serves a stale bundle. Poll instead.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3001:3001"
    volumes:
      - ./dashboard:/app
      - dashboard_node_modules:/app/node_modules
      # Keep the build cache off the Windows bind mount — next dev writes it
      # constantly, and a host-built .next is not portable into the container.
      - dashboard_next:/app/.next
    depends_on:
      - api

  # --- Observability -----------------------------------------------------
  # Scrapes Celery task events off the Redis broker and exports Prometheus
  # metrics (scan throughput, failures, runtime).
  celery-exporter:
    image: danihodovic/celery-exporter:latest
    environment:
      CE_BROKER_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus:latest
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
      - celery-exporter

  grafana:
    image: grafana/grafana:latest
    environment:
      # Dev-only default admin creds — change for any shared deployment.
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3002:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  dashboard_node_modules:
  dashboard_next:
  promdata:
  grafanadata:
  scandata:
